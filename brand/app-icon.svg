<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WorldFixture">
  <title>WorldFixture</title>
  <!--
    The home screen and PWA icon.

    FULL BLEED, WITH ROOM AT THE EDGE. iOS and Android apply their own mask and
    crop to it, so this draws the background out to the edge and keeps the mark
    inside a safe circle: the mark is the logo at 84%, which leaves the corners
    and about 8% of each edge for someone else's rounding to eat.
  -->
  <rect width="64" height="64" fill="#061127"/>

  <defs>
    <linearGradient id="wf-ring" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0" stop-color="#50B1FF"/>
      <stop offset="1" stop-color="#3097FF"/>
    </linearGradient>
  </defs>

  <g transform="translate(32 32) scale(0.84) translate(-32 -32)">
    <path d="M43.52 54.41A25.2 25.2 0 1 1 53.67 44.86"
          fill="none" stroke="url(#wf-ring)" stroke-width="5.05"/>

    <g fill="#28DCB0">
      <circle cx="26" cy="26" r="1.36"/><circle cx="32" cy="26" r="1.36"/><circle cx="38" cy="26" r="1.36"/>
      <circle cx="26" cy="32" r="1.36"/><circle cx="32" cy="32" r="1.36"/><circle cx="38" cy="32" r="1.36"/>
      <circle cx="26" cy="38" r="1.36"/><circle cx="32" cy="38" r="1.36"/><circle cx="38" cy="38" r="1.36"/>
    </g>

    <rect x="46.65" y="47.85" width="8.55" height="8.6" fill="#28DCB0"/>
  </g>
</svg>
