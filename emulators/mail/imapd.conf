configdirectory: /tmp/worldfixture-mail/cyrus
proc_path: /tmp/worldfixture-mail/run/proc
mboxname_lockpath: /tmp/worldfixture-mail/run/lock
defaultpartition: default
partition-default: /tmp/worldfixture-mail/spool
admins: cyrus cyrus@@@DOMAIN@@
allowanonymouslogin: no
allowplaintext: yes
altnamespace: yes
unixhierarchysep: yes
sasl_pwcheck_method: auxprop
sasl_auxprop_plugin: sasldb
sasl_mech_list: PLAIN LOGIN
servername: @@DOMAIN@@
# Seeding delivers a person's own sent mail to `local+Sent@domain`, and Cyrus
# matches the folder after the plus sign case-sensitively. Downcasing the whole
# recipient would send those copies to a `sent` mailbox the world never declared.
lmtp_downcase_rcpt: no
autocreate_quota: 0
autocreate_post: yes
# The folder set an address created by later LMTP delivery receives. It is the
# world's own folder list, written here at startup, not a compiled-in default.
autocreate_inbox_folders: @@FOLDERS@@
virtdomains: userid
defaultdomain: @@DOMAIN@@
annotation_db: skiplist
duplicate_db: skiplist
mboxlist_db: skiplist
quota_db: quotalegacy
seenstate_db: skiplist
statuscache_db: skiplist
subscription_db: flat
tls_sessions_db: skiplist
userdeny_db: flat
conversations: no
search_engine: none
idlemethod: poll
