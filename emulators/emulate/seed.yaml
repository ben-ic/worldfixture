# Mail that ARRIVES, rather than mail that is already there.
#
# Everything above is applied once at start, so `historyId` never advances and a
# registered Gmail watch would have nothing to deliver for the whole session. These
# are inserted through the emulator's own `messages.insert` at the stated offset from
# process start, which records history through the normal path and therefore triggers
# a real push — the difference between a demo that shows an inbox and a demo that
# shows software reacting to a message it has not seen before.
#
# Read by the composer, never by the vendor emulator: `seedFromConfig` handles only
# users, oauth_clients, labels, messages, calendars, calendar_events and drive_items,
# and would ignore an unknown key silently.
#
# Timed for a fifteen-minute session with a visitor who has just signed in: the first
# lands while they are still reading the inbox, the second a couple of minutes later.
worldfixture:
  arrivals:
    - after_seconds: 90
      message:
        from: Fern Ellery <fern@sample-supplier.worldfixture.test>
        to: demo@demo.worldfixture.test
        subject: "Re: Invoice 4471 for August"
        snippet: Sorry — wrong total on that invoice, corrected copy below.
        thread_id: emu-thr-001
        body_text: |
          Apologies, the total on 4471 was wrong. It should read 389.00, not
          412.00. Corrected copy attached.

          Fern
        label_ids: ["INBOX", "UNREAD", "Receipts"]

    - after_seconds: 240
      message:
        from: Status <status@sample-vendor.worldfixture.test>
        to: demo@demo.worldfixture.test
        subject: Scheduled maintenance this weekend
        snippet: Two hours of downtime on Saturday from 02:00 UTC.
        body_text: |
          We will be performing scheduled maintenance on Saturday from 02:00 UTC.
          Expect up to two hours of downtime. No action is needed.
        label_ids: ["INBOX", "UNREAD"]
