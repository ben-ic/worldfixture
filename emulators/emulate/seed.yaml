# Seed for the WorldFixture API emulator — a demo Google Workspace.
#
# VERIFIED by running emulate 0.8.0 against this file, not written from the docs.
# Three things that only running it revealed:
#
#   1. The `tokens` block is REQUIRED and is TOP LEVEL, not under `google`.
#      Without it the emulator installs its own default — `test_token_admin ->
#      login: admin` — and `users/me` resolves to a user with no mail. The
#      mailbox seeds correctly and the app sees an EMPTY INBOX, which is the
#      exact failure this seed exists to prevent, arriving silently.
#
#   2. Custom labels must be declared ONCE. Naming them in a `labels:` block AND
#      referencing them from a message's `label_ids` creates each twice, and the
#      app renders a sidebar with every custom label doubled. Messages carry
#      their labels, so `label_ids` alone is enough — the emulator creates what
#      it does not find.
#
#   3. `threads`, `drafts` and `filters` are NOT seedable in 0.8.0, whatever the
#      published docs say: `seedFromConfig` handles users, oauth_clients, labels,
#      messages, calendars, calendar_events and drive_items, and nothing else.
#      Threading still works — it comes from `thread_id` on the messages, which
#      is why the reply below shares a thread with what it answers.
#
# Nothing here is a credential. Every address is `.worldfixture.test`, which can never
# resolve, and the mail is written to be obviously sample content: a visitor must
# not mistake a seeded mailbox for a real one.
#
# The content is chosen for what Inbox Zero DOES — categorise, draft, summarise —
# so the demo has an invoice, a scheduling request, a newsletter, a customer
# question, a cold outreach and one reply already sent.

tokens:
  demo_token:
    login: demo@demo.worldfixture.test
    scopes: ["openid", "email", "profile", "https://www.googleapis.com/auth/gmail.modify"]

  # ONE TOKEN PER VENDOR, and the login has to exist in THAT vendor's store.
  #
  # Both halves are load-bearing and neither is obvious. A vendor with no seed block
  # has no user, so `defaultFallback` resolves a login nothing knows and every call
  # answers 401 — measured against GitHub, which is what sent us looking. Adding the
  # seed block alone is not enough either: the token map is global across listeners,
  # so a Google-scoped token reaching GitHub is still refused.
  #
  # Logins and scopes below are each vendor's own, taken from upstream's registry
  # rather than chosen.
  microsoft_token:
    login: maya@northstar-relay.worldfixture.test
    scopes:
      - openid
      - email
      - profile
      - User.Read
  github_token:
    login: octocat
    scopes:
      - repo
      - user
      - admin:org
      - admin:repo_hook
  vercel_token:
    login: developer
    scopes: []
  slack_token:
    login: U000000001
    scopes: []
  apple_token:
    login: testuser@sample.worldfixture.test
    scopes:
      - openid
      - email
      - name
  okta_token:
    login: testuser@sample.worldfixture.test
    scopes:
      - openid
      - profile
      - email
      - groups
  aws_token:
    login: admin
    scopes:
      - s3:*
      - sqs:*
      - iam:*
      - sts:*
  resend_token:
    login: re_test_admin
    scopes: []
  stripe_token:
    login: sk_test_admin
    scopes: []
  mongoatlas_token:
    login: admin
    scopes: []
  clerk_token:
    login: test@sample.worldfixture.test
    scopes: []
  linear_token:
    login: admin@sample.worldfixture.test
    scopes: []
  twilio_token:
    login: AC00000000000000000000000000000000
    scopes: []
  notion_token:
    login: maya@northstar-relay.worldfixture.test
    scopes: ["read:user", "read:content", "write:content", "read:comment", "insert:comment", "interact:agents"]

