name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # Two contract tests and several runtime cases read a built world. They
      # skip without one, and a skipped guard is not a guard.
      - name: Build the worlds the tests read
        run: |
          for world in worlds/*/world.json; do
            PYTHONPATH=compiler python3 -m worldfixture_compiler build \
              "$world" --output "dist/$(basename "$(dirname "$world")")"
          done

      - name: Lint
        run: |
          pipx run ruff check .
          npx --yes @biomejs/biome@2.3.14 lint .

      - run: PYTHONPATH=compiler python3 -m unittest discover -s tests -t .

      - name: Runtime
        run: |
          npm --prefix runtime/workbench-ui ci
          npm --prefix runtime/workbench-ui run build
          cd runtime && node --test

      - name: Emulators
        run: |
          npm --prefix emulators/emulate ci
          cd emulators/emulate && node --test

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # The promise the product rests on. PYTHONHASHSEED differs between the two
      # builds because dict ordering is the likeliest way it would quietly break.
      - name: Every world compiles to the same bytes twice
        run: |
          set -eu
          for world in worlds/*/world.json; do
            name=$(basename "$(dirname "$world")")
            PYTHONHASHSEED=1 PYTHONPATH=compiler python3 -m worldfixture_compiler build "$world" --output "/tmp/a/$name" >/dev/null
            PYTHONHASHSEED=99999 PYTHONPATH=compiler python3 -m worldfixture_compiler build "$world" --output "/tmp/b/$name" >/dev/null
            diff -r "/tmp/a/$name" "/tmp/b/$name" || { echo "::error::$name is not deterministic"; exit 1; }
          done
