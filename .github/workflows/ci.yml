name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install compiler dependencies
        run: python3 -m pip install .

      # Contract and runtime tests require the built artifacts they read.
      - name: Build the worlds the tests read
        run: |
          for world in worlds/*/world.json; do
            PYTHONPATH=compiler python3 -m worldfixture_compiler build \
              "$world" --output "dist/$(basename "$(dirname "$world")")"
          done

      - name: Lint
        run: |
          pipx run ruff check .
          npx --yes @biomejs/biome@2.3.14 lint .

      - run: PYTHONPATH=compiler python3 -m unittest discover -s tests -t .

      # BEFORE the runtime suite, not with the emulator suite. `emulate` is a
      # child process, `node src/main.mjs`, and it imports @emulators/core on
      # its first line. Installed later, it exits instantly on ERR_MODULE_NOT_FOUND
      # and 22 runtime tests fail on a readiness check that reports only
      # `fetch failed`.
      - name: Install the provider emulator's pinned dependencies
        run: npm --prefix emulators/emulate ci

      # `ensureImage` builds a missing service image on demand, inside whatever
      # readiness budget the test allowed. That is fine on a machine that has
      # built it once; on a runner with an empty cache, building Cyrus from a
      # Debian base takes longer than cli.test.mjs's 300 seconds and 23 tests
      # fail with `up never became ready` and no mention of an image build.
      - name: Prepare the service images the tests start
        run: node scripts/prepare-service-images.mjs

      - name: Runtime
        run: |
          npm --prefix runtime/workbench-ui ci
          npm --prefix runtime/workbench-ui run build
          cd runtime && node --test

      - name: Emulators
        run: cd emulators/emulate && node --test

  coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install compiler dependencies
        run: python3 -m pip install .

      - name: Build every source world for the matrix
        run: |
          for world in worlds/*/world.json; do
            PYTHONPATH=compiler python3 -m worldfixture_compiler build \
              "$world" --output "dist/$(basename "$(dirname "$world")")"
          done

      - name: Test the evidence checks and alien generator
        run: |
          npm --prefix emulators/emulate ci
          npm run test:coupling:unit
          PYTHONPATH=compiler python3 -m unittest tests.contracts.test_coupling_fixture

      - name: Build the current product image
        run: docker buildx build --load -t worldfixture:coupling-ci .

      - name: Check world selection through direct and host launch
        run: npm run test:world-selection -- --image worldfixture:coupling-ci --report .worldfixture/coupling/p1-selection --run

      # This is strict from its first run. Known defects remain visible; there
      # is no continue-on-error or missing-Docker skip that can turn them green.
      - name: Check all worlds through their own provider APIs
        run: npm run test:coupling -- --image worldfixture:coupling-ci --report .worldfixture/coupling-ci

      - name: Keep the measured failures and generation seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupling-evidence
          path: |
            .worldfixture/coupling-ci
            .worldfixture/coupling/p1-selection
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install compiler dependencies
        run: python3 -m pip install .

      # The promise the product rests on. PYTHONHASHSEED differs between the two
      # builds because dict ordering is the likeliest way it would quietly break.
      - name: Every world compiles to the same bytes twice
        run: |
          set -eu
          for world in worlds/*/world.json; do
            name=$(basename "$(dirname "$world")")
            PYTHONHASHSEED=1 PYTHONPATH=compiler python3 -m worldfixture_compiler build "$world" --output "/tmp/a/$name" >/dev/null
            PYTHONHASHSEED=99999 PYTHONPATH=compiler python3 -m worldfixture_compiler build "$world" --output "/tmp/b/$name" >/dev/null
            diff -r "/tmp/a/$name" "/tmp/b/$name" || { echo "::error::$name is not deterministic"; exit 1; }
          done
