name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/check-docs.mjs", "scripts/render-architecture.mjs", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "scripts/check-docs.mjs", "scripts/render-architecture.mjs", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm --prefix docs ci
      - run: npm run docs:check
      - run: npm run docs:diagrams:check
      - run: npm --prefix docs run build
